[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phifieldlab"
version = "0.1.0"
description = "Reproducible synthetic scientific-weight training laboratory (E0)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MichaelWave369 Research Ecosystem"}]
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3", "safetensors>=0.4,<1"]

[project.optional-dependencies]
spinchain = ["scipy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phifieldlab = ["schemas/*.json"]
