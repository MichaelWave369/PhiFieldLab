name: E1 graph-model train and replay
on:
  push:
    branches: [main]
    paths:
      - 'src/phifieldlab/e1.py'
      - 'tests/test_e1.py'
      - 'docs/E1_PROTOCOL.md'
      - '.github/workflows/e1.yml'
  pull_request:
    paths:
      - 'src/phifieldlab/e1.py'
      - 'tests/test_e1.py'
      - 'docs/E1_PROTOCOL.md'
      - '.github/workflows/e1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e1-train-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Six E1 controls and unit tests
        run: python -m unittest discover -s tests -p test_e1.py -v
      - name: Train from random initialization on synthetic graphs
        run: |
          python -m phifieldlab.e1 train --out artifacts/local/e1-ci --device cpu
      - name: Hash-check and replay checkpoint scores
        run: |
          python -m phifieldlab.e1 verify --out artifacts/local/e1-ci --device cpu
      - name: Upload operator-unverified checkpoint and receipts
        uses: actions/upload-artifact@v4
        with:
          name: e1-synthetic-cpu-unattested
          path: artifacts/local/e1-ci/
          if-no-files-found: error
          retention-days: 7
