name: D3 Cleanroom Isolation Smoke
on:
  pull_request:
    paths:
      - 'src/phifieldlab/discovery_d3.py'
      - 'src/phifieldlab/d2_network_sim.py'
      - 'src/phifieldlab/d2_network_worker.py'
      - 'src/phifieldlab/schemas/d3_policy.json'
      - 'cleanroom/**'
      - '.dockerignore'
      - 'missions/d1-examples/network-switch-latency.json'
      - '.github/workflows/d3-cleanroom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local editable host-side validator
        run: python -m pip install --no-deps -e . # cleanroom host runner uses only the stdlib
      - name: Check isolation policy refusals
        run: python -m unittest discover -s tests -p test_discovery_d3.py -v
      - name: Install reviewed base image (network allowed only for Docker pull)
        run: docker pull python:3.11-alpine
      - name: Build only the allowlisted simulator files, no build network
        run: docker build --network none --pull=false -f cleanroom/Dockerfile -t phifieldlab-d3:ci .
      - name: Exercise Docker preflight, isolated run, and fresh container replay
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker image inspect --format '{{.Id}}' phifieldlab-d3:ci)"
          mission="missions/d1-examples/network-switch-latency.json"
          python -m phifieldlab.discovery_d3 preflight --image "$image"
          plan="$(python -m phifieldlab.discovery_d3 plan --mission "$mission")"
          mission_sha="$(printf '%s' "$plan" | python -c 'import sys,json; print(json.load(sys.stdin)["mission_sha256"])')"
          python -m phifieldlab.discovery_d3 run --mission "$mission" --image "$image" --approve-local --expect-sha256 "$mission_sha" --out artifacts/local/d3-ci.json
          python -m phifieldlab.discovery_d3 verify --mission "$mission" --image "$image" --approve-local --expect-sha256 "$mission_sha" --file artifacts/local/d3-ci.json
      - name: Confirm no published network access or host bind mounts
        run: |
          python - <<'PY'
          from phifieldlab.discovery_d3 import command
          args = command('sha256:'+'a'*64, name='phifield-d3-0123456789abcdef')
          assert ['--network', 'none'] == args[args.index('--network'):args.index('--network')+2]
          assert '--read-only' in args
          assert '--volume' not in args and '--mount' not in args
          assert '--cap-drop' in args
          print('D3 policy command checks passed; real Linux container smoke completed above')
          PY
