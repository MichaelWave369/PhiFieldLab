name: E0 + QP0–QP5 + Discovery D0/D1 reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[spinchain]"
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate D0 mission and permission firewall
        run: python -m phifieldlab.discovery plan --mission missions/qp5-d0-matched-controls.json
      - name: Validate three D1 proposal examples (never execute them)
        run: |
          python -m phifieldlab.discovery_d1 validate --file missions/d1-examples/network-switch-latency.json
          python -m phifieldlab.discovery_d1 validate --file missions/d1-examples/music-arrangement-listener-study.json
          python -m phifieldlab.discovery_d1 validate --file missions/d1-examples/spin-chain-scaling-question.json
      - name: Reproduce QP1 finite-chain command
        run: python -m phifieldlab spinchain --start 3 --stop 8 --write artifacts/local/qp1-ci.json
      - name: Independently replay QP2 finite edge-state JSON
        run: |
          python -m phifieldlab.qp2 verify --file web/src/data/qp2-reference.json
          python -m phifieldlab.qp2 write --out artifacts/local/qp2-ci-reference.json
          python -m phifieldlab.qp2 verify --file artifacts/local/qp2-ci-reference.json
      - name: Recompute QP3 matched-Hamiltonian model output
        run: |
          python -m phifieldlab.qp3 write --out artifacts/local/qp3-ci.json
          python -m phifieldlab.qp3 verify --file artifacts/local/qp3-ci.json
      - name: Recompute QP4 finite spectrum and verify artifact
        run: |
          python -m phifieldlab.qp4 write --out artifacts/local/qp4-ci.json
          python -m phifieldlab.qp4 verify --file artifacts/local/qp4-ci.json
      - name: Recompute finite Schmidt spectra and cross-check QP4
        run: |
          python -m phifieldlab.qp5 write --out artifacts/local/qp5-ci.json
          python -m phifieldlab.qp5 verify --file artifacts/local/qp5-ci.json
      - name: Verify bundled E0 sample checkpoint
        run: python -m phifieldlab verify --out artifacts/sample-e0 --device cpu
      - name: Training smoke and checkpoint replay
        run: |
          python -m phifieldlab train --out artifacts/local/ci-smoke --device cpu --epochs 5 --train-count 96 --val-count 32 --test-count 32
          python -m phifieldlab verify --out artifacts/local/ci-smoke --device cpu
