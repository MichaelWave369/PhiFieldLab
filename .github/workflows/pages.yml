name: ΦField Lab · React Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/phifieldlab/schemas/**'
      - 'missions/d1-examples/**'
      - 'src/phifieldlab/qp3.py'
      - 'src/phifieldlab/qp4.py'
      - 'src/phifieldlab/qp5.py'
      - 'src/phifieldlab/spin_chain.py'
      - 'artifacts/sample-e0/**'
      - 'docs/QP3_PROTOCOL.md'
      - 'docs/QP4_PROTOCOL.md'
      - 'docs/QP5_PROTOCOL.md'
      - 'docs/D1_MISSION_DESIGNER.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'src/phifieldlab/qp3.py'
      - 'src/phifieldlab/qp4.py'
      - 'src/phifieldlab/qp5.py'
      - 'src/phifieldlab/spin_chain.py'
      - 'docs/QP3_PROTOCOL.md'
      - 'docs/QP4_PROTOCOL.md'
      - 'docs/QP5_PROTOCOL.md'
      - 'artifacts/sample-e0/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phifield-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical physics dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2"
      - name: Generate and verify QP3 browser data from Python
        run: |
          PYTHONPATH=src python -m phifieldlab.qp3 write --out web/src/data/qp3-reference.json
          PYTHONPATH=src python -m phifieldlab.qp3 verify --file web/src/data/qp3-reference.json
          PYTHONPATH=src python -m phifieldlab.qp4 write --out web/src/data/qp4-reference.json
          PYTHONPATH=src python -m phifieldlab.qp4 verify --file web/src/data/qp4-reference.json
          PYTHONPATH=src python -m phifieldlab.qp5 write --out web/src/data/qp5-reference.json
          PYTHONPATH=src python -m phifieldlab.qp5 verify --file web/src/data/qp5-reference.json
      - name: Install site dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Check QP0 parity model
        working-directory: web
        run: npm test
      - name: Build site
        working-directory: web
        run: npm run build
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
